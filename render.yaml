# ============================================
# Render Blueprint - Foodie Hub Restaurant
# Deploys the FULL app (frontend + backend) + PostgreSQL
# rootDir is the repo root so static files (HTML/CSS/JS)
# and the backend are all available to the Express server.
# ============================================
services:
  - type: web
    name: foodie-hub
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: foodiehub-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: PORT
        value: 10000

databases:
  - name: foodiehub-db
    plan: free
    databaseName: restaurant_db
    user: postgres
    postgresMajorVersion: "16"
